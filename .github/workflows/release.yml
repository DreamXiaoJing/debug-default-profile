name: Release

# 打一个 v* 标签就全自动：构建 → 校验 → 建 GitHub Release（附产物）→ 发 PyPI
# 想重跑：在该 run 的页面点 “Re-run all jobs”
on:
  push:
    tags: ["v*"]

permissions:
  contents: write           # 建 / 更新 GitHub Release
  id-token: write           # PyPI 信任发布（OIDC，仓库里不用存 token）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5

      - name: 构建 wheel + sdist
        run: uv build

      - name: 校验元数据与 README
        run: uvx twine check dist/*

      - name: 建 GitHub Release 并附上产物
        uses: softprops/action-gh-release@v2
        with:
          # 只挂真正的产物：dist/ 里还有 hatchling 生成的 .gitignore，别一起传上去
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

      # 需要在 PyPI 配一次 Trusted Publisher（见 docs/releasing.md）。
      # 没配 / 版本已存在都不会影响 Release：失败或跳过都不拦后面的流程。
      - name: 发布到 PyPI
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      # 注：GitHub Packages 没有 PyPI / Python 仓库（只有 npm、RubyGems、Maven、Gradle、
      # NuGet 和容器镜像），所以 Python 包推不到仓库侧边栏的 Packages 面板，统一走 PyPI。
